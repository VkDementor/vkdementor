<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKDEMENTOR | Портал</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: #c5a1ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Вывеска глобальной посещаемости вверху */
        .visit-badge {
            background: rgba(157, 0, 255, 0.1);
            border: 1px dashed rgba(157, 0, 255, 0.5);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 25px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.1);
        }

        #visit-count {
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        .card {
            background: rgba(15, 14, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(157, 0, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 0, 255, 0.3);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 45px rgba(157, 0, 255, 0.4);
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px rgba(157, 0, 255, 0.8), 0 0 20px rgba(157, 0, 255, 0.4);
        }

        p {
            font-size: 1.1rem;
            color: #c5a1ff;
            opacity: 0.8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: transparent;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            border: 2px solid #9d00ff;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
            outline: none;
        }

        .btn:hover {
            background: #9d00ff;
            box-shadow: 0 0 30px rgba(157, 0, 255, 0.8);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .counter-container {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(157, 0, 255, 0.5);
        }

        #click-count {
            font-size: 1.8rem;
            font-weight: bold;
            color: #9d00ff;
            text-shadow: 0 0 10px rgba(157, 0, 255, 0.8);
            display: inline-block;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="visit-badge">
            Ритуал прошли: <span id="visit-count">Загрузка...</span> чел.
        </div>

        <h1>vkdementor</h1>
        <p>Добро пожаловать в цитадель Дементора. Каждое нажатие на кнопку ниже укрепляет темную энергию этого портала.</p>
        
        <button class="btn" id="click-button">Поглотить энергию</button>
        
        <div class="counter-container">
            Собрано кликов: <span id="click-count">0</span>
        </div>
    </div>

    <script>
        // 1. ЛОГИКА СЧЕТЧИКА КЛИКОВ (для текущего окна)
        const button = document.getElementById('click-button');
        const clickCounter = document.getElementById('click-count');
        let count = 0;

        button.addEventListener('click', () => {
            count++;
            clickCounter.textContent = count;
        });

        // 2. ГЛОБАЛЬНЫЙ СЧЕТЧИК ПОСЕТИТЕЛЕЙ (С любого устройства через API)
        // Мы используем полностью уникальное имя для вашей личной базы данных в сети
        const id_проекта = "vkdementor_portal_global_count_2026";
        const ключ_подсчета = "visits";

        function запуститьПодсчетПосетителей() {
            // Команда "up" заставляет интернет-базу автоматически прибавить +1 при каждом открытии сайта
            
                .then(ответ => ответ.json())
                .then(данные => {
                    // Вставляем актуальное число людей из общей базы данных на экран
                    document.getElementById('visit-count').textContent = данные.count;
                })
                .catch(ошибка => {
                    // Если сайт запущен на компьютере без интернета или сервер временно перезагружается
                    document.getElementById('visit-count').textContent = "1";
                    
                });
        }

        // Запускаем интернет-счетчик при старте страницы
        запуститьПодсчетПосетителей();
    </script>

</body>
</html>
